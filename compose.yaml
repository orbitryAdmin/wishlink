services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wishlist_studio
      POSTGRES_USER: wishlist_studio
      POSTGRES_PASSWORD: wishlist_studio
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wishlist_studio -d wishlist_studio"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
